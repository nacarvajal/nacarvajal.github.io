name: Generate optimized banner WebP assets

on:
  push:
    branches:
      - seo/phase2-service-banner-20261103
    paths:
      - ".github/workflows/optimize-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Generate responsive images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          image = Image.open("header-jats-xml.png").convert("RGB")
          for width in (800, 1600):
              target = image.resize((width, round(image.height * width / image.width)), Image.Resampling.LANCZOS)
              target.save(f"header-jats-xml-{width}.webp", "WEBP", quality=82, method=6)
              print(width, Path(f"header-jats-xml-{width}.webp").stat().st_size)
          PY
      - name: Commit generated assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header-jats-xml-800.webp header-jats-xml-1600.webp
          if ! git diff --cached --quiet; then
            git commit -m "perf: generate responsive WebP banners"
            git push
          fi
